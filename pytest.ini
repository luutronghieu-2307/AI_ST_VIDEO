# pytest.ini – Cấu hình pytest cho dự án AURA AI Logo Generator
[pytest]
testpaths = test
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Thêm project root vào Python path để import được modules
pythonpath = .

# Hiển thị output chi tiết
addopts = 
    -v
    --tb=short
    --strict-markers
    --no-header

# Markers
markers =
    unit: Unit tests (không cần server)
    integration: Integration tests (cần FastAPI app)
    slow: Tests chạy chậm
