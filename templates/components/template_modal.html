<!-- Template Manager Modal Component -->
<div class="modal hidden" id="templateManagerModal">
    <div class="modal-backdrop" id="templateModalBackdrop"></div>
    <div class="modal-content modal-card glass-card">
        <div class="modal-header">
            <div class="modal-title">
                <i class="fa-solid fa-layer-group accent-icon"></i>
                <div>
                    <h3>Quản lý Prompt Templates</h3>
                    <span class="modal-subtitle">Tích chọn các template muốn xóa hoặc dùng lại</span>
                </div>
            </div>
            <button class="close-modal" id="closeTemplateModalBtn" title="Đóng"><i class="fa-solid fa-xmark"></i></button>
        </div>

        <div class="template-manager-toolbar">
            <label class="custom-checkbox-label" id="selectAllTemplatesWrapper">
                <input type="checkbox" id="selectAllTemplatesCb">
                <span class="custom-checkmark"><i class="fa-solid fa-check"></i></span>
                <span>Chọn tất cả (Template người dùng)</span>
            </label>
            <div class="toolbar-actions">
                <button type="button" id="deleteSelectedTemplatesBtn" class="text-btn danger-text action-sm hidden">
                    <i class="fa-solid fa-trash-can"></i> Xóa đã chọn (<span id="selectedTemplatesCount">0</span>)
                </button>
            </div>
        </div>

        <div class="template-list-container" id="templateListContainer">
            <!-- Dynamic Template Items injected by JS -->
        </div>

        <div class="modal-footer">
            <span class="info-note"><i class="fa-solid fa-shield-halved"></i> Template mặc định được bảo vệ, không thể xóa</span>
            <button type="button" class="secondary-btn btn-sm" id="doneTemplateModalBtn">Đóng</button>
        </div>
    </div>
</div>
